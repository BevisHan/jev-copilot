name: image

# Builds the container on GitHub's runners and publishes it to GHCR, so the NAS
# only ever pulls. It needs no Rust toolchain and spends none of its own CPU.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runners ship a Rust toolchain. --locked fails loudly if Cargo.lock is
      # stale rather than quietly resolving to different versions than local.
      - run: cargo test --locked --verbose

  image:
    # Do not publish an image that fails its own tests.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase paths, and GitHub usernames may contain capitals.
      - name: Normalise image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically; no personal token needed to push.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The NAS is x86_64 and so are the runners, so build natively and skip
          # the QEMU emulation a multi-arch build would drag in.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
